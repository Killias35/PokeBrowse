<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combat Pokémon</title>

    <link rel="stylesheet" href="../css/battle-annimation-start.css">
    <link rel="stylesheet" href="../css/battle.css">
    <link rel="stylesheet" href="../css/battle-capture.css">
    <link rel="stylesheet" href="../css/defense-style.css">
</head>
<body>
    <main class="battle-container" id="container">
        <div id="combat-bg" class=""></div>
        <main class="battle-container" id="container">
            <header class="battle-header">
                <h1>Pokémon Sauvage</h1>
            </header>

            <div id="dim-background" class="dim-background"></div>

            <section class="battle-arena" id="battle-arena">
                <div class="pokemon-zone" id="pokemon-zone">
                <div class="effects-centering-wrapper">
                    <div id="light-rays" class="light-rays"></div>
                    <div class="radial-burst"></div>
                    <div id="particles-container"></div>
                    <div id="speed-lines" class="speed-lines"></div>
                </div>
                <div id="encounter-effect" class="encounter-effect"></div>

                <img id="pokemon-shadow" class="pokemon-shadow" src="" alt="">
                <img id="pokemon-sprite" class="pokemon-sprite pokemon-hide" src="" alt="">

                <h2 id="pokemon-name"></h2>
                <h3 id="pokemon-rarity"></h3>

                <!-- Splash screen -->
                <div id="splash-screen" class="hidden">
                    <h1 id="splash-text">ACTION !</h1>
                </div>

                <!-- Choix de la Pokéball -->
                <div id="capture-ui" class="hidden">
                    <div id="ball-selection-panel">
                        <h2 class="urgent-text">Vite ! Choisis une Pokéball !</h2>
                        
                        <div class="timer-track">
                            <div id="timer-bar"></div>
                        </div>

                        <div id="ball-container" class="ball-grid">
                            </div>
                    </div>
                </div>

                <!-- Combat -->
                <div id="combat-click-area" class="hidden">
                    <div class="hp-wrapper" id="hp-wrapper">
                        <div id="hp-bar-bg"><div id="hp-bar-fill"></div></div>
                    </div>
                    <div id="impact-container"></div> </div>
                </div>

                <!-- Capture -->
                <div id="capture-zone" class="hidden">
                    <div id="capture-feedback"></div>
                    <div class="energy-core"></div>
                    <div class="target-ring"></div>
                    <div id="pulse-ring" class="pulse-ring"></div>
                </div>

                <!-- Stage de capture -->
                <div id="cap-stage" class="hidden">

                    <!-- Flash plein écran -->
                    <div id="cap-flash"></div>

                    <!-- Ombre de la Pokéball -->
                    <div id="cap-shadow"></div>

                    <!-- Conteneur animé de la Pokéball -->
                    <div id="cap-ball-wrap" class="state-ready">
                        <img
                            id="cap-ball"
                            src="../assets/balls/pokeball.png"
                            alt="Pokéball">
                    </div>

                    <!-- Clone temporaire du Pokémon utilisé pour l'aspiration -->
                    <img
                        id="cap-poke-ghost"
                        class="hidden"
                        alt="Pokémon fantôme">

                    <!-- Message final -->
                    <div id="cap-message" class="hidden"></div>
                </div>

                
                <!-- Fuite -->
                <div id="defense-stage" class="hidden">
                    <div id="defense-header">
                        <div id="attack-name-display"></div>
                        <div id="defense-warning"></div>
                        <div id="defense-timer"></div>
                    </div>
                    <div id="survival-bar-track">
                        <div id="survival-bar-fill"></div>
                    </div>
                    <div id="defense-arena">
                        <div id="arena-flash-overlay"></div>
                        <div id="player-avatar"></div>
                    </div>
                </div>

            </div>
            </section>
        </main>

    </main>

    <script type="module" src="../js/battle.js"></script>

</body>
</html>
