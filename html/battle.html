<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combat Pokémon</title>

    <link rel="stylesheet" href="../css/battle.css">
</head>
<body>

    <div class="battle-background"></div>

    <main class="battle-container">

        <header class="battle-header">
            <h1>Pokémon Sauvage</h1>
        </header>

        <section class="battle-arena">

            <div class="pokemon-zone">

                <div id="encounter-effect" class="encounter-effect"></div>

                <img
                    id="pokemon-shadow"
                    class="pokemon-shadow"
                    src=""
                    alt=""
                >

                <img
                    id="pokemon-sprite"
                    class="pokemon-sprite pokemon-hide"
                    src=""
                    alt=""
                >

                <h2 id="pokemon-name"></h2>

            </div>

        </section>

    </main>

    <script type="module" src="../js/battle.js"></script>

</body>
</html>
