<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Collection Pokémon</title>
    <link rel="stylesheet" href="../css/collection.css">
</head>
<body>

    <div class="background"></div>

    <main class="pokedex">

        <header class="pokedex-header">
          <div class="pokeball"></div>
        <h2>
            Ma Collection
            <span class="collection-badge" id="nb-pokemons-badge">
                0%
            </span>
        </h2>          
          <button id="reset-collection" class="reset-btn">
              Libérer tous les Pokémon !
          </button>
        </header>

        <section class="collection-container">
            <h2>Ma Collection</h2>

            <div id="list" class="pokemon-grid">
                <!-- Les Pokémon seront ajoutés ici -->
            </div>

        </section>

    </main>

    <script type="module" src="../js/collection.js"></script>

</body>
</html>
