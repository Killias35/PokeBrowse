<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Hunter</title>
    <link rel="stylesheet" href="../css/popup.css">
    <link rel="stylesheet" href="../css/pokedex-oppening.css">
</head>
<body>
    <div id="login-overlay" class="hidden">
        <div class="overlay-content">
            <p>⚠️ Vous devez être connecté</p>
            <p>Cliquez sur l'engrenage pour configurer votre profil.</p>
        </div>
    </div>

    <div id="loading-indicator" class="loading-indicator hidden">
        <div class="loading-spinner"></div>
        <span>Chargement des données...</span>
    </div>
    <div id="pokedex-boot-screen">
        <div class="locket"></div>
    </div>
    <div class="pokedex">
        <button id="btn-settings" class="settings-gear-btn" title="Ouvrir les paramètres">
            ⚙️
        </button>
        <button id="btn-encounters" class="encounters-grass-btn" title="Voir les Pokémon de cette zone">
            🌿
        </button>
        <button id="btn-leaderboard" class="leaderboard-btn" title="Leaderboard">
            🏆
        </button>
        <button id="btn-deconnection" class="deconnection-btn" title="deconnection">
            🚪
        </button>
        <header class="header">
            <div class="pokeball"></div>

            <h1>Pokémon Hunter</h1>
            <p><span id="name"></span> Attrape-les tous !</p>
        </header>

        <div class="menu">
            
            <button id="spawn" class="action-btn primary">
                🎲 Faire apparaître un Pokémon
            </button>

            <button id="pokedex" class="action-btn">
                📖 Pokédex
            </button>

            <button id="toggleHunt" class="action-btn hunt-off">
              🔴 Chasse désactivée
            </button>

            <div class="ball-inventory">

            <div class="ball-title">
                🎒 Inventaire des Poké Balls
            </div>

            <div id="ballList" class="ball-list">

            </div>
        </div>

        <footer class="footer">
            <div class="status-light"></div>
            <span>Système opérationnel</span>
        </footer>

    </div>

    <script type="module" src="../js/Injected/popup.js"></script>
    <script type="module" src="../js/Injected/pokeballs.js"></script>

</body>
</html>
