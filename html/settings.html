<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paramètres - Pokémon Hunter</title>
    <link rel="stylesheet" href="../css/popup.css">
    <link rel="stylesheet" href="../css/settings.css">
</head>
<body>

    <div class="pokedex">
        <header class="header">
            <h1>⚙️ Paramètres</h1>
            <p>Configuration du système</p>
        </header>

        <div class="settings-container">
            
            <div class="setting-group">
                <label for="username">Nom du Dresseur</label>
                <input type="text" id="username" class="custom-input" placeholder="Ex: Sacha" autocomplete="off">
            </div>

            <div class="setting-group">
                <label for="vol-global">Volume Global : <span id="val-global">1.0</span></label>
                <input type="range" id="vol-global" class="custom-slider" min="0.01" max="1.0" step="0.01">
            </div>

            <div class="setting-group">
                <label for="vol-music">Volume Musique : <span id="val-music">1.0</span></label>
                <input type="range" id="vol-music" class="custom-slider" min="0.01" max="1.0" step="0.01">
            </div>

            <div class="setting-group">
                <label for="vol-sfx">Volume SFX : <span id="val-sfx">1.0</span></label>
                <input type="range" id="vol-sfx" class="custom-slider" min="0.01" max="1.0" step="0.01">
            </div>

        </div>

        <div class="menu" style="margin-top: 20px;">
            <button id="btn-training" class="action-btn primary">
                💪 Mode Entraînement
            </button>

            <button id="btn-back" class="action-btn closed">
                ⬅️ Retour au menu
            </button>
        </div>
    </div>

    <script type="module" src="../js/Injected/settings.js"></script>

</body>
</html>
