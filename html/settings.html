<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paramètres - Pokémon Hunter</title>
    <link rel="stylesheet" href="../css/popup.css">
    <link rel="stylesheet" href="../css/settings.css">
</head>
<body>
    <div class="pokedex">
        <header class="header">
            <h1>⚙️ Paramètres</h1>
            <p>Configuration du système</p>
        </header>

        <div class="settings-container">
            
            <div class="setting-group">
                <label for="username">Nom du Dresseur</label>
                <input type="text" id="username" class="custom-input" placeholder="Ex: Sacha" autocomplete="off">
            </div>

            <div class="setting-group">
                <label for="identifiant">Identifiant Secret</label>
                <input type="password" id="identifiant" class="custom-input" placeholder="Ton code secret" autocomplete="off">
            </div>

            <div id="auth-message" class="auth-message hidden"></div>

            <div id="auth-buttons" class="auth-buttons">
                <button id="btn-login" class="action-btn primary">🔑 Connexion</button>
                <button id="btn-register" class="action-btn">📝 Créer un compte</button>
            </div>

            <hr class="separator">

            <div id="profile-section" class="hidden">
                <div class="setting-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" class="custom-input" placeholder="Ex: Maître de la Ligue" autocomplete="off">
                </div>

                <div class="setting-group">
                    <label for="image">Avatar (Lien image)</label>
                    <div class="image-preview-container">
                        <img id="image-preview" src="" alt="Aperçu">
                        <input type="number" id="image" class="custom-input" placeholder="Numero du pokemon" autocomplete="off">
                    </div>
                </div>
            </div>

            <div class="setting-group">
                <label for="vol-global">Volume Global : <span id="val-global" class="val-badge">1.0</span></label>
                <input type="range" id="vol-global" class="custom-slider global-slider" min="0.01" max="1.0" step="0.01">
            </div>

            <div class="setting-group">
                <label for="vol-music">Volume Musique : <span id="val-music" class="val-badge">1.0</span></label>
                <input type="range" id="vol-music" class="custom-slider music-slider" min="0.01" max="1.0" step="0.01">
            </div>

            <div class="setting-group">
                <label for="vol-sfx">Volume SFX : <span id="val-sfx" class="val-badge">1.0</span></label>
                <input type="range" id="vol-sfx" class="custom-slider sfx-slider" min="0.01" max="1.0" step="0.01">
            </div>

        </div>

        <div class="menu" style="margin-top: 10px;">
            <button id="btn-confirm" class="action-btn confirm">
                ✔️ Enregistrer (Profil & Audio)
            </button>
            <button id="btn-training" class="action-btn primary">
                💪 Mode Entraînement
            </button>
            <button id="btn-back" class="action-btn closed">
                ⬅️ Retour au menu
            </button>
        </div>
    </div>

    <script type="module" src="../js/Injected/settings.js"></script>

</body>
</html>
